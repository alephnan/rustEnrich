name: Rust checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Documentation and client checks (no credentials)
        run: |
          python3 tools/check_docs.py
          python3 tools/test_smoke_client.py
      - name: Compose configuration
        run: |
          docker compose config --quiet
          docker compose -f compose.yaml -f compose.virustotal.yaml config --quiet
      - name: Install pinned toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Build
        run: cargo build --locked
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Tests (mock providers only)
        run: cargo test --locked
      - name: Install pinned dependency auditor
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Dependency audit
        run: cargo audit
